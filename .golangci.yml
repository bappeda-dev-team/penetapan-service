run:
  timeout: 5m
  tests: true
linters:
  enable:
    - govet
    - staticcheck
    - gosec
    - errcheck
    - ineffassign
    - unused
    - bodyclose
    - contextcheck
    - gocritic
    - revive
linters-settings:
  gosec:
    severity: medium
    confidence: medium
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
output:
  formats:
    - format: colored-line-number
