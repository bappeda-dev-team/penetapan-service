info:
  contact:
    name: Kertaskerja Dev Team
  description: Service snapshot penetapan tujuan, sasaran, renja, rekin untuk pemda,
    opd, dan individu
  termsOfService: http://swagger.io/terms/
  title: Penetapan Service
  version: "1.0"
paths:
  /healthcheck:
    get:
      description: checking if this service is accessible
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_model_web.Response-web_HealthcheckResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_model_web.ErrorResponse'
      summary: healthcheck
      tags:
      - healthcheck
  /individu/rekin:
    get:
      consumes:
      - application/json
      description: Mengambil data rencana kinerja individu berdasarkan id_pegawai,
        kode OPD dan tahun penetapan
      parameters:
      - description: Id Pegawai
        in: query
        name: pegawaiId
        required: true
        type: string
      - description: Kode OPD
        in: query
        name: kodeOpd
        required: true
        type: string
      - description: Tahun Penetapan
        in: query
        name: tahun
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data rekin individu
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_individu_web.Response-web_RekinIndividuResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_individu_web.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_individu_web.ErrorResponse'
      summary: Get rencana kinerja individu penetapan
      tags:
      - Individu
  /individu/rekin/sync:
    post:
      consumes:
      - application/json
      description: Sinkron data pk penetapan berdasarkan id_pegawai, kode OPD dan
        tahun penetapan
      parameters:
      - description: Payload sync penetapan individu
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/web.SyncPenetapanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_individu_web.Response-web_SyncPenetapanResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_individu_web.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_individu_web.ErrorResponse'
      summary: Sync Rekin individu
      tags:
      - Individu
  /opd/renaksi:
    get:
      consumes:
      - application/json
      description: Mengambil data renaksi OPD berdasarkan kode OPD dan tahun penetapan
      parameters:
      - description: Kode OPD
        in: query
        name: kodeOpd
        required: true
        type: string
      - description: Tahun Penetapan
        in: query
        name: tahun
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data renja OPD
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_model_web.Response-web_RenaksiOpdPenetapanResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_model_web.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_model_web.ErrorResponse'
      summary: Get renaksi OPD penetapan
      tags:
      - OPD
  /opd/renja:
    get:
      consumes:
      - application/json
      description: Mengambil data renja OPD berdasarkan kode OPD dan tahun penetapan
      parameters:
      - description: Kode OPD
        in: query
        name: kodeOpd
        required: true
        type: string
      - description: Tahun Penetapan
        in: query
        name: tahun
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data renja OPD
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_model_web.Response-web_RenjaPenetapanOpdResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_model_web.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_model_web.ErrorResponse'
      summary: Get renja OPD penetapan
      tags:
      - OPD
  /opd/renja/sync:
    post:
      consumes:
      - application/json
      description: Sinkron data penetapan renja OPD berdasarkan kode OPD dan tahun
        dari perencanaan
      parameters:
      - description: Payload sinkronisasi penetapan OPD
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/web.SyncPenetapanOpdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_model_web.Response-web_SyncPenetapanOpdResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_model_web.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_model_web.ErrorResponse'
      summary: Sync Penetapan Renja OPD
      tags:
      - Sync
  /opd/sasaran:
    get:
      consumes:
      - application/json
      description: Mengambil data sasaran OPD berdasarkan kode OPD dan tahun penetapan
      parameters:
      - description: Kode OPD
        in: query
        name: kodeOpd
        required: true
        type: string
      - description: Tahun Penetapan
        in: query
        name: tahun
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data sasaran OPD
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_model_web.Response-web_SasaranPenetapanOpdResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_model_web.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_bappeda-dev-team_penetapan-service_internal_model_web.ErrorResponse'
      summary: Get sasaran OPD penetapan
      tags:
      - OPD
  /opd/sasaran/sync:
    post:
      consumes:
      - application/json
      description: Sinkron data penetapan sasaran OPD berdasarkan kode OPD dan tahun
        dari perencanaan
      parameters:
      - description: Payload sinkronisasi penetapan OPD
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/web.SyncPenetapanOpdRequest'
      produces:
      - application/json
      responses:
