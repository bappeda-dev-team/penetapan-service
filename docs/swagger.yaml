basePath: /
definitions:
  web.ErrorResponse:
    properties:
      error: {}
    type: object
  web.HealthcheckResponse:
    properties:
      status:
        type: string
      system_info:
        $ref: '#/definitions/web.HealthcheckSystemInfo'
    type: object
  web.HealthcheckSystemInfo:
    properties:
      environment:
        type: string
      version:
        type: string
    type: object
  web.IndikatorSasaranPenetapanResponse:
    properties:
      id:
        type: integer
      indikator:
        type: string
      rumus_perhitungan:
        type: string
      sumber_data:
        type: string
      tahun_aktif:
        type: integer
      target:
        items:
          $ref: '#/definitions/web.TargetIndikatorResponse'
        type: array
    type: object
  web.IndikatorTujuanPenetapanResponse:
    properties:
      definisi_operasional:
        example: definisi abc
        type: string
      id:
        example: 1
        type: integer
      id_tujuan_opd:
        example: 12
        type: integer
      indikator:
        example: Indikator kepuasa publik
        type: string
      rumus_perhitungan:
        example: indeks kepuasan masyarakat
        type: string
      sumber_data:
        example: bps
        type: string
      tahun_aktif:
        example: 2025
        type: integer
      target:
        items:
          $ref: '#/definitions/web.TargetIndikatorResponse'
        type: array
    type: object
  web.Response-web_HealthcheckResponse:
    properties:
      data:
        $ref: '#/definitions/web.HealthcheckResponse'
    type: object
  web.Response-web_SasaranPenetapanOpdResponse:
    properties:
      data:
        $ref: '#/definitions/web.SasaranPenetapanOpdResponse'
    type: object
  web.Response-web_SyncPenetapanOpdResponse:
    properties:
      data:
        $ref: '#/definitions/web.SyncPenetapanOpdResponse'
    type: object
  web.Response-web_TujuanPenetapanOpdResponse:
    properties:
      data:
        $ref: '#/definitions/web.TujuanPenetapanOpdResponse'
    type: object
  web.SasaranPenetapanOpdResponse:
    properties:
      id:
        type: integer
      indikator:
        items:
          $ref: '#/definitions/web.IndikatorSasaranPenetapanResponse'
        type: array
      kode_opd:
        type: string
      kode_sasaran_opd:
        type: string
      periode:
        type: string
      sasaran_opd:
        type: string
      tahun_aktif:
        type: integer
    type: object
  web.SyncPenetapanOpdRequest:
    properties:
      jenis_penetapan:
        enum:
        - TUJUAN-OPD
        - SASARAN-OPD
        example: TUJUAN-OPD
        type: string
      kode_opd:
        example: 1.22.33
        type: string
      tahun:
        example: 2025
        type: integer
    type: object
  web.SyncPenetapanOpdResponse:
    properties:
      jenis_penetapan:
        example: TUJUAN-OPD
        type: string
      kode_opd:
        example: 1.22.33
        type: string
      processed_at:
        type: string
      processed_summary:
        $ref: '#/definitions/web.SyncPenetapanOpdSummary'
      status:
        example: SUCCESS
        type: string
      sync_id:
        example: 155
        type: integer
      tahun:
        example: 2025
        type: integer
    type: object
  web.SyncPenetapanOpdSummary:
    properties:
      indikator:
        example: 3
        type: integer
      renja:
        example: 1
        type: integer
      sasaran:
        example: 1
        type: integer
      target:
        example: 4
        type: integer
      tujuan:
        example: 1
        type: integer
    type: object
  web.TargetIndikatorResponse:
    properties:
      id:
        example: 1
        type: integer
      indikator_id:
        type: integer
      satuan:
        example: '%'
        type: string
      tahun:
        example: 2025
        type: integer
      target:
        example: 100
        type: number
    type: object
  web.TujuanPenetapanOpdResponse:
    properties:
      id:
        example: 1
        type: integer
      indikator:
        items:
          $ref: '#/definitions/web.IndikatorTujuanPenetapanResponse'
        type: array
      kode_opd:
        example: 1.02.0.00.0.00.01.0000
        type: string
      kode_tujuan_opd:
        example: TUJ-001
        type: string
      periode:
        example: 2025-2029
        type: string
      tahun_aktif:
        example: 2025
        type: integer
      tujuan_opd:
        example: Meningkatkan kualitas pelayanan publik
        type: string
      versi:
        example: 1
        type: integer
    type: object
  web.ValidationErrorResponse:
    properties:
      error:
        additionalProperties:
          type: string
        example:
          kode_opd: required
          tahun: required
        type: object
    type: object
info:
  contact:
    name: Kertaskerja Dev Team
  description: Service snapshot penetapan tujuan, sasaran, renja, rekin untuk pemda,
    opd, dan individu
  termsOfService: http://swagger.io/terms/
  title: Penetapan Service
  version: "1.0"
paths:
  /healthcheck:
    get:
      description: checking if this service is accessible
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.Response-web_HealthcheckResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: healthcheck
      tags:
      - healthcheck
  /opd/sasaran:
    get:
      consumes:
      - application/json
      description: Mengambil data sasaran OPD berdasarkan kode OPD dan tahun penetapan
      parameters:
      - description: Kode OPD
        in: query
        name: kodeOpd
        required: true
        type: string
      - description: Tahun Penetapan
        in: query
        name: tahun
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data sasaran OPD
          schema:
            items:
              $ref: '#/definitions/web.Response-web_SasaranPenetapanOpdResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Get sasaran OPD penetapan
      tags:
      - OPD
  /opd/sync_penetapan:
    post:
      consumes:
      - application/json
      description: Sinkron data penetapan OPD berdasarkan kode OPD, tahun dan jenis
        penetapan dari perencanaan
      parameters:
      - description: Payload sinkronisasi penetapan OPD
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/web.SyncPenetapanOpdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data tujuan OPD
          schema:
            $ref: '#/definitions/web.Response-web_SyncPenetapanOpdResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/web.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Sync Penetapan OPD
      tags:
      - Sync
  /opd/tujuan:
    get:
      consumes:
      - application/json
      description: Mengambil data tujuan OPD berdasarkan kode OPD dan tahun penetapan
      parameters:
      - description: Kode OPD
        in: query
        name: kodeOpd
        required: true
        type: string
      - description: Tahun Penetapan
        in: query
        name: tahun
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil data tujuan OPD
          schema:
            items:
              $ref: '#/definitions/web.Response-web_TujuanPenetapanOpdResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Get tujuan OPD penetapan
      tags:
      - OPD
schemes:
- http
- https
swagger: "2.0"
